<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#162a22">
  <title>蒼境紀事 V0.1.0</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#14251f; overscroll-behavior:none; }
    button { font:inherit; cursor:pointer; touch-action:none; -webkit-user-select:none; user-select:none; }
    #game { display:block; width:100%; height:100%; height:100dvh; touch-action:none; }
    #hud { position:fixed; top:calc(12px + env(safe-area-inset-top)); left:14px; right:14px;
      display:flex; align-items:flex-start; justify-content:space-between; gap:12px; pointer-events:none; }
    .plate { background:rgba(16,32,27,.83); border:1px solid rgba(238,214,163,.42);
      border-radius:12px; box-shadow:0 3px 14px #06130e66; backdrop-filter:blur(5px); padding:9px 12px; }
    .title { font-size:14px; font-weight:800; color:#f8dca5; letter-spacing:2px; }
    .meta { color:#d7e8d7; font-size:11px; margin-top:5px; }
    #saveState { font-size:11px; color:#d0d6bc; text-align:right; }
    #area { font-size:12px; font-weight:700; color:#fff0c9; text-align:right; margin-bottom:5px; }
    #tip { position:fixed; top:calc(84px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
      background:#142c24e8; color:#fff4d4; border:1px solid #d8b676a1; padding:9px 12px;
      border-radius:10px; font-size:12px; max-width:88vw; width:max-content; text-align:center;
      pointer-events:none; opacity:0; transition:opacity .25s; }
    #tip.show { opacity:1; }
    #pad { position:fixed; bottom:calc(22px + env(safe-area-inset-bottom)); left:16px;
      display:grid; grid-template-columns:repeat(3,58px); grid-template-rows:repeat(3,58px); gap:5px; }
    .move { width:58px; height:58px; border-radius:15px; border:2px solid #e5d19b96;
      background:#203d32df; color:#f7e7bd; font-size:27px; font-weight:800;
      box-shadow:0 3px 0 #091b14c9, inset 0 2px 5px #ffffff18; }
    .move:active,.move.pressed { background:#ad8f50; color:#17291e; transform:translateY(2px); box-shadow:0 1px 0 #091b14c9; }
    .up { grid-column:2; grid-row:1; } .left { grid-column:1; grid-row:2; }
    .right { grid-column:3; grid-row:2; } .down { grid-column:2; grid-row:3; }
    #menuBtn { position:fixed; right:20px; bottom:calc(57px + env(safe-area-inset-bottom));
      width:78px; height:78px; border-radius:50%; color:#f7e5b6; font-size:14px; font-weight:800;
      background:#213b32e8; border:2px solid #e5c7869e; box-shadow:0 4px 14px #081910a3; }
    #menuBtn:active { background:#776238; }
    #panel { position:fixed; inset:0; background:#06150fc9; display:grid; place-items:center;
      padding:24px; z-index:5; }
    #panel[hidden] { display:none; }
    .dialog { width:min(350px,100%); background:#20362d; border:1px solid #d7be81;
      border-radius:18px; padding:22px; box-shadow:0 10px 50px #0009; }
    .dialog h2 { margin:0 0 10px; color:#f9dda1; font-size:21px; }
    .dialog p { color:#d6e4d6; font-size:13px; line-height:1.8; }
    .action { display:block; width:100%; padding:13px 10px; margin-top:10px; border:1px solid #ad9569;
      border-radius:10px; background:#365346; color:#fff2d6; font-weight:700; }
    .action.primary { background:#b4924c; color:#162c21; }
    @media (max-height:600px) {
      #pad { transform:scale(.78); transform-origin:bottom left; }
      #menuBtn { width:62px; height:62px; bottom:calc(34px + env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>
  <canvas id="game" aria-label="蒼境紀事的俯視角遊戲地圖"></canvas>
  <header id="hud">
    <div class="plate"><div class="title">蒼境紀事</div><div class="meta">旅人 · Lv.1　|　V0.1.0</div></div>
    <div class="plate"><div id="area">晨霧村</div><div id="saveState" aria-live="polite">尚未存檔</div></div>
  </header>
  <div id="tip" role="status" aria-live="polite"></div>
  <nav id="pad" aria-label="角色移動">
    <button type="button" class="move up" data-dir="up" aria-label="向上移動">↑</button>
    <button type="button" class="move left" data-dir="left" aria-label="向左移動">←</button>
    <button type="button" class="move right" data-dir="right" aria-label="向右移動">→</button>
    <button type="button" class="move down" data-dir="down" aria-label="向下移動">↓</button>
  </nav>
  <button type="button" id="menuBtn">選單</button>
  <section id="panel" hidden aria-label="遊戲選單" role="dialog" aria-modal="true">
    <div class="dialog">
      <h2>蒼境紀事</h2>
      <p>版本：V0.1.0（探索測試版）<br>操作：按住方向鍵移動，鬆開停止。<br>進度會自動儲存在此瀏覽器。</p>
      <p id="menuStatus">存檔狀態：尚未存檔</p>
      <button type="button" class="action primary" id="saveBtn">立即存檔</button>
      <button type="button" class="action" id="resetBtn">回到起點</button>
      <button type="button" class="action" id="closeBtn">繼續冒險</button>
    </div>
  </section>
<script>
(() => {
  'use strict';
  const VERSION = '0.1.0';
  const SAVE_KEY = 'azure_chronicle_save_v1';
  const TILE = 48, COLS = 32, ROWS = 24;
  const WORLD_W = COLS * TILE, WORLD_H = ROWS * TILE;
  const START = { x: 8.5 * TILE, y: 11.5 * TILE };
  const SPEED = 154, RADIUS = 12;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const areaEl = document.getElementById('area');
  const saveEl = document.getElementById('saveState');
  const panel = document.getElementById('panel');
  const menuStatus = document.getElementById('menuStatus');
  const tip = document.getElementById('tip');
  if (!ctx) { alert('此瀏覽器不支援 Canvas。'); return; }

  // 0 草地、1 道路、2 樹木、3 水域、4 房屋（障礙物）。
  const map = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
  const houses = [
    { x:3,y:4,w:3,h:3,roof:'#9e5c4b' },
    { x:12,y:4,w:3,h:3,roof:'#5c7991' },
    { x:3,y:16,w:3,h:3,roof:'#84709a' },
    { x:12,y:16,w:3,h:3,roof:'#a77d48' }
  ];
  function noise(x,y,seed=0) {
    let n = Math.sin(x * 127.1 + y * 311.7 + seed * 74.7) * 43758.5453;
    return n - Math.floor(n);
  }
  // 固定地圖：新手村、通往幽影林緣的主路、湖泊與房屋。
  for (let y=0; y<ROWS; y++) {
    for (let x=0; x<COLS; x++) {
      const path = ((y===11 || y===12) && x>0 && x<COLS-1) ||
                   ((x===8 || x===9) && y>=3 && y<=20);
      const lake = Math.pow((x-25)/3.6,2) + Math.pow((y-19)/2.7,2) < 1;
      if (path) map[y][x]=1;
      else if (lake) map[y][x]=3;
      else if (x===0 || y===0 || x===COLS-1 || y===ROWS-1) map[y][x]=2;
      else if (noise(x,y,4) < (x>=18 ? .24 : .055)) map[y][x]=2;
    }
  }
  // 村屋附近清出可通行空間，避免樹木擋住房屋四周。
  for (const h of houses) {
    for (let y=h.y-1; y<=h.y+h.h; y++) {
      for (let x=h.x-1; x<=h.x+h.w; x++) {
        if (x>0 && x<COLS-1 && y>0 && y<ROWS-1 && map[y][x]===2) map[y][x]=0;
      }
    }
    for (let y=h.y; y<h.y+h.h; y++)
      for (let x=h.x; x<h.x+h.w; x++) map[y][x]=4;
  }
  // 確保起點及中央主要道路完全暢通。
  for (let x=1; x<COLS-1; x++) { map[11][x]=1; map[12][x]=1; }
  for (let y=7; y<=15; y++) { map[y][8]=1; map[y][9]=1; }

  const hero = { x:START.x, y:START.y, dir:'down', step:0 };
  const camera = { x:0, y:0 };
  const buttons = [...document.querySelectorAll('.move')];
  const pointers = new Map();
  const keys = new Set();
  let w=1,h=1,dpr=1, dirty=false, lastSave=0, lastFrame=0, currentArea='', tipTimeout=0;

  function blockedAt(x,y) {
    const tx=Math.floor(x/TILE), ty=Math.floor(y/TILE);
    return tx<0 || ty<0 || tx>=COLS || ty>=ROWS || map[ty][tx]>=2;
  }
  function canWalk(x,y) {
    const r=RADIUS;
    return !blockedAt(x-r,y-r) && !blockedAt(x+r,y-r) &&
           !blockedAt(x-r,y+r) && !blockedAt(x+r,y+r);
  }
  function message(s) {
    tip.textContent=s;
    tip.classList.add('show');
    clearTimeout(tipTimeout);
    tipTimeout=setTimeout(()=>tip.classList.remove('show'),2600);
  }
  function loadGame() {
    try {
      const value=localStorage.getItem(SAVE_KEY);
      if (!value) return false;
      const data=JSON.parse(value);
      if (data && Number.isFinite(data.x) && Number.isFinite(data.y) && canWalk(data.x,data.y)) {
        hero.x=data.x; hero.y=data.y;
        saveEl.textContent='已讀取存檔';
        return true;
      }
    } catch(e) { saveEl.textContent='存檔無法讀取'; }
    return false;
  }
  function saveGame() {
    try {
      localStorage.setItem(SAVE_KEY,JSON.stringify({
        version:VERSION, x:Math.round(hero.x*100)/100, y:Math.round(hero.y*100)/100,
        savedAt:new Date().toISOString()
      }));
      dirty=false; lastSave=performance.now();
      saveEl.textContent='✓ 已儲存';
      return true;
    } catch(e) {
      saveEl.textContent='⚠ 無法儲存';
      return false;
    }
  }
  function areaName() { return hero.x>=19*TILE ? '幽影林緣' : '晨霧村'; }
  function updateArea() {
    const name=areaName();
    if (name!==currentArea) {
      if (currentArea) message('已抵達：'+name);
      currentArea=name; areaEl.textContent=name;
    }
  }
  function stopMove() {
    pointers.clear(); keys.clear();
    buttons.forEach(b=>b.classList.remove('pressed'));
  }
  function toggleMenu(show) {
    panel.hidden=!show;
    stopMove();
    if (show) menuStatus.textContent='存檔狀態：'+saveEl.textContent;
  }
  document.getElementById('menuBtn').addEventListener('click',()=>toggleMenu(true));
  document.getElementById('closeBtn').addEventListener('click',()=>toggleMenu(false));
  document.getElementById('saveBtn').addEventListener('click',()=>{
    message(saveGame()?'進度已儲存':'儲存失敗：請確認瀏覽器設定');
    menuStatus.textContent='存檔狀態：'+saveEl.textContent;
  });
  document.getElementById('resetBtn').addEventListener('click',()=>{
    if (!confirm('確定要回到村莊起點？此動作會覆蓋目前的位置存檔。')) return;
    hero.x=START.x; hero.y=START.y; dirty=true;
    updateArea(); saveGame(); toggleMenu(false); message('已回到晨霧村');
  });
  buttons.forEach(button=>{
    const direction=button.dataset.dir;
    button.addEventListener('pointerdown',e=>{
      if (!panel.hidden) return;
      e.preventDefault();
      pointers.set(e.pointerId,direction);
      button.classList.add('pressed');
      try { button.setPointerCapture(e.pointerId); } catch(err) {}
    });
    const end=e=>{
      if (pointers.get(e.pointerId)===direction) pointers.delete(e.pointerId);
      if (![...pointers.values()].includes(direction)) button.classList.remove('pressed');
    };
    button.addEventListener('pointerup',end);
    button.addEventListener('pointercancel',end);
    button.addEventListener('lostpointercapture',end);
    button.addEventListener('contextmenu',e=>e.preventDefault());
  });
  const keyMap={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',
                w:'up',a:'left',s:'down',d:'right'};
  window.addEventListener('keydown',e=>{
    const dir=keyMap[e.key] || keyMap[e.key.toLowerCase()];
    if (dir) { e.preventDefault(); if (panel.hidden) keys.add(dir); }
    if (e.key==='Escape') toggleMenu(!panel.hidden);
  });
  window.addEventListener('keyup',e=>{
    const dir=keyMap[e.key] || keyMap[e.key.toLowerCase()];
    if (dir) { e.preventDefault(); keys.delete(dir); }
  });
  window.addEventListener('blur',stopMove);
  window.addEventListener('pagehide',()=>{ if (dirty) saveGame(); });
  document.addEventListener('visibilitychange',()=>{
    if (document.hidden) { stopMove(); if (dirty) saveGame(); }
  });
  function resize() {
    const box=canvas.getBoundingClientRect();
    w=Math.max(1,box.width); h=Math.max(1,box.height);
    dpr=Math.min(window.devicePixelRatio||1,2);
    canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.imageSmoothingEnabled=false;
    camera.x=Math.max(0,Math.min(WORLD_W-w,hero.x-w/2));
    camera.y=Math.max(0,Math.min(WORLD_H-h,hero.y-h/2));
  }
  window.addEventListener('resize',resize);

  function update(dt,time) {
    if (panel.hidden) {
      let dx=0,dy=0;
      const active=new Set([...pointers.values(),...keys]);
      if (active.has('left')) dx--;
      if (active.has('right')) dx++;
      if (active.has('up')) dy--;
      if (active.has('down')) dy++;
      if (dx||dy) {
        const length=Math.hypot(dx,dy); dx/=length; dy/=length;
        const nx=hero.x+dx*SPEED*dt, ny=hero.y+dy*SPEED*dt;
        let moved=false;
        if (canWalk(nx,hero.y)) { hero.x=nx; moved=true; }
        if (canWalk(hero.x,ny)) { hero.y=ny; moved=true; }
        if (moved) { dirty=true; hero.step+=dt*10; saveEl.textContent='● 尚未儲存'; }
        if (Math.abs(dx)>Math.abs(dy)) hero.dir=dx>0?'right':'left';
        else hero.dir=dy>0?'down':'up';
      } else hero.step=0;
    }
    updateArea();
    const goalX=Math.max(0,Math.min(Math.max(0,WORLD_W-w),hero.x-w/2));
    const goalY=Math.max(0,Math.min(Math.max(0,WORLD_H-h),hero.y-h/2));
    const smooth=Math.min(1,dt*11);
    camera.x+=(goalX-camera.x)*smooth;
    camera.y+=(goalY-camera.y)*smooth;
    if (dirty && time-lastSave>3500) saveGame();
  }
  function box(x,y,bw,bh,color) { ctx.fillStyle=color; ctx.fillRect(x,y,bw,bh); }
  function ellipse(x,y,rx,ry,color) {
    ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);
    ctx.fillStyle=color; ctx.fill();
  }
  function drawGround(x,y,tile,tx,ty) {
    const n=noise(tx,ty,1);
    if (tile===1) {
      box(x,y,TILE,TILE,n>.5?'#b79b72':'#b09870');
      box(x+5,y+8,12,3,'#a18a66');
      if (n>.45) box(x+29,y+30,8,4,'#c6ac7e');
    } else if (tile===3) {
      box(x,y,TILE,TILE,'#356b7a');
      box(x+3,y+10,21,2,'#64a2a5');
      if(n>.5) box(x+21,y+34,18,2,'#80b7b7');
    } else {
      box(x,y,TILE,TILE,n>.5?'#547b4e':'#597f51');
      if (n>.35) box(x+8,y+13,3,8,'#70955d');
      if (n>.58) { box(x+31,y+30,4,4,'#e2d28a'); box(x+34,y+30,4,4,'#e0c28d'); }
      if (n<.19) { box(x+28,y+12,8,4,'#467149'); box(x+19,y+37,5,3,'#779458'); }
    }
  }
  function drawTree(tx,ty) {
    const x=tx*TILE,y=ty*TILE,alt=noise(tx,ty,7)>.5;
    ellipse(x+25,y+40,21,7,'#294b32aa');
    box(x+19,y+20,12,20,'#5d422f');
    box(x+23,y+24,4,12,'#926640');
    ellipse(x+25,y+21,23,23,alt?'#265f45':'#2a6641');
    ellipse(x+16,y+14,16,16,alt?'#397d4f':'#41834b');
    ellipse(x+33,y+14,13,16,'#347344');
    box(x+12,y+10,10,4,'#569b5a');
  }
  function drawHouse(house) {
    const x=house.x*TILE,y=house.y*TILE,ww=house.w*TILE,hh=house.h*TILE;
    box(x+9,y+15,ww-9,hh-10,'#23392cb3');
    box(x+6,y+35,ww-12,hh-41,'#c5b590');
    box(x+13,y+55,ww-26,hh-61,'#e0c9a1');
    box(x+2,y+9,ww-4,56,'#513d37');
    box(x+8,y+3,ww-16,53,house.roof);
    for (let i=0;i<3;i++) box(x+13,y+12+i*14,ww-26,3,'#ffffff25');
    box(x+ww/2-13,y+hh-43,26,43,'#4a392d');
    box(x+ww/2-8,y+hh-37,16,30,'#69503a');
    box(x+ww/2+5,y+hh-23,3,3,'#efc574');
    box(x+17,y+hh-46,17,18,'#506b68');
    box(x+ww-34,y+hh-46,17,18,'#506b68');
    box(x+17,y+hh-46,17,3,'#f1db99');
    box(x+ww-34,y+hh-46,17,3,'#f1db99');
  }
  function drawSign() {
    const x=17*TILE+23, y=10*TILE+16;
    box(x-3,y,6,32,'#69462b');
    box(x-23,y-12,46,21,'#b18a50');
    box(x-20,y-9,40,15,'#dcc18b');
    box(x+8,y-4,7,4,'#715530');
    box(x+14,y-6,5,8,'#715530');
  }
  function drawHero() {
    const x=hero.x, y=hero.y,walking=hero.step!==0;
    const bob=walking?Math.sin(hero.step*2)*2:0;
    const stride=walking?Math.sin(hero.step)*3:0;
    ellipse(x,y+13,15,6,'#203a2b8c');
    box(x-9,y+2+bob+stride,7,13,'#2a2a31');
    box(x+2,y+2+bob-stride,7,13,'#2a2a31');
    box(x-13,y-13+bob,26,25,'#1c2d36');
    box(x-10,y-12+bob,20,23,'#406786');
    box(x-10,y-9+bob,20,5,'#6498ad');
    box(x-15,y-9+bob,5,17,'#c5a07f');
    box(x+10,y-9+bob,5,17,'#c5a07f');
    ellipse(x,y-21+bob,11,12,'#d7a982');
    if (hero.dir==='up') {
      box(x-11,y-31+bob,22,13,'#48372d');
      box(x-12,y-24+bob,5,12,'#48372d');
    } else {
      box(x-11,y-32+bob,22,9,'#49372d');
      box(x-12,y-28+bob,5,9,'#49372d');
      box(x+7,y-28+bob,5,9,'#49372d');
      if (hero.dir==='down') {
        box(x-6,y-21+bob,3,3,'#282e32');
        box(x+3,y-21+bob,3,3,'#282e32');
      } else {
        box(x+(hero.dir==='right'?5:-8),y-21+bob,4,3,'#282e32');
      }
    }
  }
  function render() {
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,w,h);
    ctx.save();
    ctx.translate(-Math.round(camera.x),-Math.round(camera.y));
    const left=Math.max(0,Math.floor(camera.x/TILE)-1);
    const right=Math.min(COLS,Math.ceil((camera.x+w)/TILE)+1);
    const top=Math.max(0,Math.floor(camera.y/TILE)-1);
    const bottom=Math.min(ROWS,Math.ceil((camera.y+h)/TILE)+1);
    for (let y=top;y<bottom;y++) for(let x=left;x<right;x++)
      drawGround(x*TILE,y*TILE,map[y][x],x,y);
    // 依角色腳底與物件位置排序，讓行走時的前後遮擋較自然。
    const sprites=[];
    for(let y=top;y<bottom;y++) for(let x=left;x<right;x++)
      if(map[y][x]===2) sprites.push({depth:y*TILE+42,draw:()=>drawTree(x,y)});
    for(const house of houses) {
      if(house.x+house.w>=left && house.x<=right && house.y+house.h>=top && house.y<=bottom)
        sprites.push({depth:(house.y+house.h)*TILE,draw:()=>drawHouse(house)});
    }
    sprites.push({depth:11*TILE+TILE,draw:drawSign});
    sprites.push({depth:hero.y+15,draw:drawHero});
    sprites.sort((a,b)=>a.depth-b.depth);
    sprites.forEach(item=>item.draw());
    ctx.restore();
    // 柔和暗角，使遊戲世界與外圍介面層次分明。
    const grad=ctx.createRadialGradient(w/2,h/2,Math.min(w,h)*.2,w/2,h/2,Math.max(w,h)*.78);
    grad.addColorStop(0,'#00000000'); grad.addColorStop(1,'#05140d40');
    ctx.fillStyle=grad; ctx.fillRect(0,0,w,h);
  }
  function frame(time) {
    const dt=lastFrame?Math.min((time-lastFrame)/1000,.04):0;
    lastFrame=time;
    update(dt,time);
    render();
    requestAnimationFrame(frame);
  }
  const restored=loadGame();
  resize(); updateArea();
  message(restored?'已讀取上次冒險進度':'按住左下角方向鍵開始探索');
  requestAnimationFrame(frame);
})();
</script>
