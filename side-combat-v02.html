<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14283e">
<title>蒼境紀事｜橫向戰鬥 V0.2 普攻＋裂空劍氣</title>
<style>
:root{color-scheme:dark;--gold:#f6d77c;--ink:#14283d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#132b41;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;image-rendering:pixelated}
#ui{position:fixed;inset:0;pointer-events:none;color:#fff6d7}
.top{position:absolute;top:max(12px,env(safe-area-inset-top));left:max(13px,env(safe-area-inset-left));right:max(13px,env(safe-area-inset-right));display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.panel{background:linear-gradient(150deg,rgba(17,39,58,.90),rgba(23,43,64,.77));border:2px solid rgba(250,222,143,.64);box-shadow:0 3px 0 rgba(4,15,31,.45),inset 0 1px rgba(255,255,255,.14);border-radius:10px;padding:8px 12px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.brand{color:#f8dc8b;letter-spacing:1.5px;font-size:clamp(12px,2.2vw,17px);font-weight:900;text-shadow:1px 2px #1a2b3c}.version{font-size:10px;color:#b8ddde;letter-spacing:.5px;margin-top:3px}
.hp{font-size:clamp(13px,2vw,17px);white-space:nowrap;letter-spacing:3px;color:#ff8191;text-shadow:1px 2px #391d35}.score{font-size:11px;color:#f8e6b5;margin-top:3px;text-align:right}
#tip{position:absolute;top:20%;left:50%;transform:translateX(-50%);width:max-content;max-width:92vw;text-align:center;font-size:clamp(11px,2vw,15px);font-weight:700;color:#ffefb5;text-shadow:1px 2px 2px #153451;opacity:1;transition:opacity .45s;pointer-events:none}
#tip.hide{opacity:0}
.controls{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:max(16px,env(safe-area-inset-left));right:max(16px,env(safe-area-inset-right));display:flex;align-items:flex-end;justify-content:space-between;gap:15px}
.group{display:flex;align-items:flex-end;gap:11px;pointer-events:auto}
.ctrl{width:clamp(58px,12vw,76px);height:clamp(58px,12vw,76px);border-radius:16px;border:2px solid rgba(255,243,180,.7);background:linear-gradient(145deg,rgba(28,60,84,.78),rgba(14,36,62,.9));box-shadow:inset 0 2px 0 rgba(255,255,255,.14),0 4px 0 rgba(10,23,43,.8),0 8px 24px rgba(6,20,38,.15);color:#fce2a0;font-weight:900;font-size:27px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;touch-action:none;pointer-events:auto;cursor:pointer}
.ctrl small{font-size:11px;letter-spacing:1px}.ctrl.action{width:clamp(68px,14vw,84px);height:clamp(68px,14vw,84px);border-radius:50%;background:linear-gradient(145deg,rgba(58,77,108,.92),rgba(29,47,92,.92))}.ctrl.attack{border-color:#edb46a;background:linear-gradient(145deg,rgba(140,74,55,.95),rgba(101,41,53,.96));color:#ffe6c8}
.ctrl.skill{border-color:#93edff;background:linear-gradient(145deg,rgba(36,122,163,.95),rgba(22,61,109,.98));color:#ecffff;position:relative}
.ctrl.cooling{filter:saturate(.66) brightness(.78)}
.ctrl.skill small{font-size:11px;white-space:nowrap}
.ctrl.pressed,.ctrl:active{transform:translateY(3px);box-shadow:inset 0 2px 5px rgba(0,0,0,.3),0 1px 0 #0b1930;filter:brightness(1.18)}
#toast{position:absolute;top:29%;left:50%;transform:translateX(-50%);background:rgba(14,34,55,.86);border:1px solid #e6c17a;border-radius:10px;padding:8px 15px;color:#fff0bd;font-size:14px;opacity:0;transition:opacity .2s;white-space:nowrap;pointer-events:none}#toast.on{opacity:1}
@media (max-width:620px) and (orientation:portrait){.brand{font-size:12px}.panel{padding:7px 9px}.top{gap:5px}.hp{font-size:13px;letter-spacing:1px}.score{font-size:10px}.controls{left:9px;right:9px;gap:5px;bottom:max(30px,env(safe-area-inset-bottom))}.group{gap:5px}.ctrl{width:clamp(42px,14.4vw,64px);height:clamp(42px,14.4vw,64px);font-size:22px}.ctrl.action{width:clamp(49px,17vw,70px);height:clamp(49px,17vw,70px)}.ctrl small{font-size:10px}#tip{top:18%;font-size:11px}}
@media (max-height:370px){.panel{padding:5px 8px}.ctrl{width:54px;height:54px}.ctrl.action{width:60px;height:60px}.group{gap:7px}#tip{top:24%}}
</style>
</head>
<body>
<canvas id="game" aria-label="蒼境紀事橫向卷軸遊戲"></canvas>
<div id="ui">
 <div class="top"><div class="panel"><div class="brand">⚔ 蒼境紀事</div><div class="version">SIDE QUEST · V0.2 劍氣戰鬥試作</div></div><div class="panel"><div class="hp" id="hp">♥ ♥ ♥ ♥ ♥ ♥</div><div class="score" id="score">擊倒 0　✦ 0</div></div></div>
 <div id="tip">← → 移動　·　跳躍　·　揮劍　·　裂空劍氣</div><div id="toast" role="status" aria-live="polite"></div>
 <div class="controls"><div class="group"><button class="ctrl" data-act="left" aria-label="向左移動">◀</button><button class="ctrl" data-act="right" aria-label="向右移動">▶</button></div><div class="group"><button class="ctrl action" data-act="jump" aria-label="跳躍">↥<small>跳躍</small></button><button class="ctrl action attack" data-act="attack" aria-label="普通攻擊">⚔<small>普攻</small></button><button class="ctrl action skill" data-act="skill" aria-label="施放裂空劍氣">✦<small id="skillCD">劍氣</small></button></div></div>
</div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false});
const HP=document.getElementById('hp'),SCORE=document.getElementById('score'),TIP=document.getElementById('tip'),TOAST=document.getElementById('toast'),SKILLBTN=document.querySelector('[data-act="skill"]'),SKILLCD=document.getElementById('skillCD');
const H=540,GROUND=421,WORLD=3200,GRAVITY=1450,MAX_SPEED=244,JUMP_V=-655;
let vw=960,scale=1,camera=0,gameT=0,toastTimer=0,tipTimer=5,last=0;
let stat={kills:0,coins:0};
const input={left:false,right:false}, keys=new Set();
const hero={x:230,y:GROUND,vx:0,vy:0,face:1,grounded:true,walk:0,attack:0,attackCD:0,hitIds:new Set(),hurt:0,hp:6,inv:0,step:0,falling:false,skillCD:0,skillCast:0};
const platforms=[{x:900,y:309,w:254,h:23},{x:1750,y:278,w:270,h:23}];
const spawn=[{x:480,base:GROUND},{x:740,base:GROUND},{x:1000,base:309},{x:1310,base:GROUND},{x:1822,base:278},{x:2100,base:GROUND},{x:2530,base:GROUND},{x:2870,base:GROUND}];
const slimes=spawn.map((s,i)=>({id:i,x:s.x,y:s.base,base:s.base,origin:s.x,vx:i%2?42:-36,hp:i>=5?3:2,alive:true,respawn:0,phase:i*1.7,hit:0}));
const particles=[],numbers=[],waves=[];
const SKILL_COOLDOWN=4.5,SKILL_DAMAGE=2,SKILL_SPEED=610,SKILL_RANGE=650;
function resize(){const r=canvas.getBoundingClientRect();const d=Math.min(2,window.devicePixelRatio||1);canvas.width=Math.max(1,Math.round(r.width*d));canvas.height=Math.max(1,Math.round(r.height*d));scale=canvas.height/H;vw=canvas.width/scale;ctx.imageSmoothingEnabled=false}
window.addEventListener('resize',resize,{passive:true});window.addEventListener('orientationchange',resize,{passive:true});resize();
function rnd(seed){let n=(seed*9301+49297)%233280;return n/233280}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function approach(v,target,amount){return v<target?Math.min(target,v+amount):Math.max(target,v-amount)}
function toast(s){TOAST.textContent=s;TOAST.classList.add('on');toastTimer=1.7}
function updateUI(){HP.textContent=Array.from({length:6},(_,i)=>i<hero.hp?'♥':'♡').join(' ');SCORE.textContent=`擊倒 ${stat.kills}　✦ ${stat.coins}`}
function doJump(){if(hero.grounded){hero.vy=JUMP_V;hero.grounded=false;hero.y-=2;emit(hero.x,hero.y-5,'#b4eb94',5)}else if(hero.coyote>0){hero.vy=JUMP_V;hero.coyote=0;hero.y-=2;emit(hero.x,hero.y-5,'#b4eb94',5)}}
function doAttack(){if(hero.attackCD>0||hero.skillCast>0)return;hero.attack=.27;hero.attackCD=.38;hero.hitIds.clear();hero.vx*=.76;emit(hero.x+hero.face*32,hero.y-39,'#f9e1a2',3)}
function doSkill(){
 if(hero.skillCD>0||hero.skillCast>0)return false;
 hero.skillCD=SKILL_COOLDOWN;hero.skillCast=.27;hero.attack=0;hero.attackCD=Math.max(hero.attackCD,.27);hero.vx*=.73;
 waves.push({x:hero.x+hero.face*47,y:hero.y-38,origin:hero.x,dir:hero.face,life:1.2,t:0,hits:new Set()});
 emit(hero.x+hero.face*40,hero.y-38,'#7cefff',16);emit(hero.x+hero.face*30,hero.y-55,'#e8ffff',8);
 return true;
}
function skillUI(){const cd=hero.skillCD;SKILLBTN.classList.toggle('cooling',cd>.025);SKILLCD.textContent=cd>.025?`${cd.toFixed(1)}秒`:'劍氣';}
function damageSlime(s,dmg,dir,isSkill){
 if(!s.alive)return;
 s.hp=Math.max(0,s.hp-dmg);s.hit=.23;
 emit(s.x,s.y-24,isSkill?'#91f1ff':'#f8df82',isSkill?20:12);
 floatNum(s.x,s.y-58,`-${dmg}`,isSkill?'#b0f6ff':'#fff0b2');s.x+=dir*(isSkill?18:8);
 if(s.hp<=0){s.alive=false;s.respawn=5;stat.kills++;stat.coins+=5;updateUI();emit(s.x,s.y-25,'#8bffbd',15);floatNum(s.x,s.y-47,'+5 ✦','#ffe18f')}
}
function setAct(act,value){if(act==='left'||act==='right')input[act]=value;else if(value){if(act==='jump')doJump();if(act==='attack')doAttack();if(act==='skill')doSkill()}if(value){tipTimer=Math.min(tipTimer,1.3)}}
const activePointers=new Map();
for(const btn of document.querySelectorAll('[data-act]')){
 const act=btn.dataset.act;
 btn.addEventListener('pointerdown',e=>{e.preventDefault();btn.setPointerCapture(e.pointerId);activePointers.set(e.pointerId,{act,btn});btn.classList.add('pressed');setAct(act,true)}, {passive:false});
 const stop=e=>{e.preventDefault();const data=activePointers.get(e.pointerId);if(!data)return;activePointers.delete(e.pointerId);data.btn.classList.remove('pressed');if(data.act==='left'||data.act==='right'){const any=[...activePointers.values()].some(q=>q.act===data.act);if(!any)setAct(data.act,false)}};
 btn.addEventListener('pointerup',stop,{passive:false});btn.addEventListener('pointercancel',stop,{passive:false});btn.addEventListener('lostpointercapture',stop,{passive:false});
 btn.addEventListener('contextmenu',e=>e.preventDefault());
}
window.addEventListener('blur',()=>{input.left=input.right=false;keys.clear();for(const p of activePointers.values())p.btn.classList.remove('pressed');activePointers.clear()});
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' ','Space','KeyA','KeyD','KeyW','KeyJ','KeyK','KeyL','KeyU'].includes(e.code))e.preventDefault();if(keys.has(e.code))return;keys.add(e.code);if(['ArrowUp','Space','KeyW'].includes(e.code))doJump();if(['KeyJ','KeyK'].includes(e.code))doAttack();if(['KeyL','KeyU'].includes(e.code))doSkill()}, {passive:false});
window.addEventListener('keyup',e=>{keys.delete(e.code)});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
function emit(x,y,color,n=7){for(let i=0;i<n;i++){let angle=Math.random()*Math.PI*2,s=35+Math.random()*130;particles.push({x,y,vx:Math.cos(angle)*s,vy:Math.sin(angle)*s-55,life:.45+Math.random()*.45,color,size:2+Math.random()*3})}}
function floatNum(x,y,v,color){numbers.push({x,y,text:v,life:.8,color})}
function sprite(){const c=document.createElement('canvas');c.width=64;c.height=80;const g=c.getContext('2d');g.imageSmoothingEnabled=false;
 const p={outline:'#26374d',hair:'#e7b956',hairLight:'#ffe89a',skin:'#f4c39f',skin2:'#cf957a',blue:'#397db5',blueLight:'#70b7df',navy:'#244b7f',steel:'#c8d8d9',steelLight:'#f6f3d7',steelShade:'#819da9',boot:'#4f414a',cape:'#3d69a0',capeLight:'#6a9dd1',gold:'#efcd7e'};
 const rect=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))};
 function paint(phase,kind){g.clearRect(0,0,64,80);let moving=kind==='run',attack=kind==='attack',air=kind==='air',hurt=kind==='hurt';let q=moving?Math.sin(phase*Math.PI/2):0;let legA=moving?Math.round(q*4):air?-3:0;let legB=moving?Math.round(-q*4):air?2:0;let lift=air?-1:0;let sway=moving?Math.round(Math.cos(phase*Math.PI/2)):0;
 // cape stays firmly anchored to armor, never independently resized
 rect(14,26+lift,24,30,p.outline);rect(12+sway,28+lift,25,30,p.cape);rect(13+sway,31+lift,20,26,p.capeLight);rect(13+sway,37+lift,7,22,p.cape);rect(17+sway,57+lift,18,3,p.navy);
 // back legs
 rect(22-legA,49,11,18,p.outline);rect(24-legA,51,8,13,p.steelShade);rect(22-legA,64,13,5,p.boot);
 rect(34-legB,49,11,18,p.outline);rect(35-legB,51,8,13,p.steel);rect(35-legB,64,14,5,p.boot);
 rect(23-legA,65,13,4,p.outline);rect(35-legB,65,14,4,p.outline);
 // body chest armor
 rect(22,26+lift,23,27,p.outline);rect(25,28+lift,18,23,p.blue);rect(28,29+lift,11,10,p.steel);rect(30,31+lift,6,7,p.steelLight);rect(26,39+lift,15,4,p.navy);rect(27,44+lift,14,4,p.gold);rect(31,44+lift,5,5,p.steelShade);
 // shoulder and cape knot
 rect(17,26+lift,14,11,p.outline);rect(20,28+lift,12,7,p.steel);rect(20,28+lift,5,3,p.steelLight);
 // face and helmet hair
 rect(23,10+lift,19,19,p.outline);rect(25,13+lift,15,14,p.skin);rect(37,20+lift,3,3,p.skin2);rect(38,19+lift,3,4,p.outline);rect(38,19+lift,2,2,p.steelLight);
 rect(22,8+lift,18,8,p.outline);rect(24,9+lift,15,7,p.hair);rect(23,14+lift,8,7,p.hair);rect(27,8+lift,9,4,p.hairLight);rect(22,16+lift,4,9,p.hair);rect(32,8+lift,10,6,p.hair);rect(25,22+lift,4,3,p.skin2);
 // silver-blue brow plate and small crest
 rect(21,15+lift,4,9,p.steel);rect(23,10+lift,4,9,p.steelLight);rect(27,13+lift,13,3,p.steelShade);rect(32,11+lift,4,5,p.gold);
 rect(35,21+lift,2,3,p.outline);rect(37,22+lift,1,1,p.steelLight);
 // waist belt
 rect(23,49+lift,23,4,p.outline);rect(26,49+lift,18,3,p.gold);rect(33,48+lift,5,5,p.steelLight);
 // left arm, covered with steel pauldron
 rect(17,32+lift,10,16,p.outline);rect(18,33+lift,9,11,p.steelShade);rect(18,34+lift,4,6,p.steelLight);rect(19,44+lift,9,6,p.boot);
 // front arm follows sword handle during attack
 if(!attack){rect(40,30+lift,10,17,p.outline);rect(42,32+lift,7,11,p.steel);rect(43,38+lift,7,6,p.navy);rect(42,44+lift,10,6,p.steelShade);rect(46,47+lift,6,4,p.skin)}
 else {rect(42,28+lift,12,8,p.outline);rect(45,29+lift,11,6,p.steel);rect(50,28+lift,10,6,p.skin);}
 if(hurt){rect(27,17,16,5,'#fff1c2');rect(30,36,15,8,'#ffe8cf')}
 }
 const cels=[];for(const kind of ['idle','run','air','attack','hurt']){const frames=kind==='run'?8:kind==='idle'?4:kind==='attack'?3:1;cels.push(Array.from({length:frames},(_,i)=>{paint(i,kind);const out=document.createElement('canvas');out.width=64;out.height=80;out.getContext('2d').drawImage(c,0,0);return out}))}
 return {idle:cels[0],run:cels[1],air:cels[2],attack:cels[3],hurt:cels[4]}
}
const sprites=sprite();
function update(dt){gameT+=dt;tipTimer-=dt;if(tipTimer<=0)TIP.classList.add('hide');if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)TOAST.classList.remove('on')}
 hero.attack=Math.max(0,hero.attack-dt);hero.attackCD=Math.max(0,hero.attackCD-dt);hero.skillCD=Math.max(0,hero.skillCD-dt);hero.skillCast=Math.max(0,hero.skillCast-dt);skillUI();hero.inv=Math.max(0,hero.inv-dt);hero.hurt=Math.max(0,hero.hurt-dt);
 const wasGrounded=hero.grounded;const dir=(input.right||keys.has('ArrowRight')||keys.has('KeyD')?1:0)-(input.left||keys.has('ArrowLeft')||keys.has('KeyA')?1:0);
 if(dir!==0){hero.face=dir;hero.vx=approach(hero.vx,dir*MAX_SPEED,dt*1600)}else hero.vx=approach(hero.vx,0,dt*1650);
 if(hero.attack>0||hero.skillCast>0)hero.vx*=Math.pow(.95,dt*60);
 if(hero.grounded)hero.coyote=.09;else hero.coyote=Math.max(0,(hero.coyote||0)-dt);
 const prevY=hero.y;hero.x=clamp(hero.x+hero.vx*dt,20,WORLD-20);hero.vy+=GRAVITY*dt;hero.y+=hero.vy*dt;
 hero.grounded=false;let landingY=GROUND;
 if(hero.vy>=0){for(const p of platforms){if(hero.x+15>p.x && hero.x-15<p.x+p.w && prevY<=p.y+8 && hero.y>=p.y){landingY=Math.min(landingY,p.y)}}
 if(hero.y>=landingY){hero.y=landingY;hero.vy=0;hero.grounded=true;}}
 if(hero.grounded&&!wasGrounded){emit(hero.x,hero.y,'#b5e3ac',4)}
 if(Math.abs(hero.vx)>25&&hero.grounded)hero.walk+=dt*Math.abs(hero.vx)/45;
 // Enemy AI is deliberately simple to isolate animation and mobile combat feel.
 for(const s of slimes){if(!s.alive){s.respawn-=dt;if(s.respawn<=0){s.alive=true;s.hp=s.id>=5?3:2;s.x=s.origin;s.hit=0}continue}
 s.phase+=dt*4.1;s.hit=Math.max(0,s.hit-dt);
 if(s.x<s.origin-60)s.vx=Math.abs(s.vx);if(s.x>s.origin+60)s.vx=-Math.abs(s.vx);
 s.x+=s.vx*dt;
 if(hero.attack>0 && hero.attack<.205 && hero.attack>.055 && !hero.hitIds.has(s.id)){
   const reach=(s.x-hero.x)*hero.face;const dy=Math.abs((hero.y-34)-(s.y-20));
   if(reach>-15&&reach<110&&dy<57){hero.hitIds.add(s.id);damageSlime(s,1,hero.face,false)}}
 if(hero.inv<=0&&Math.abs(hero.x-s.x)<30&&Math.abs(hero.y-30-(s.y-20))<36){hero.hp--;hero.inv=.95;hero.hurt=.35;hero.vx=hero.x<s.x?-310:310;hero.vy=-265;hero.grounded=false;emit(hero.x,hero.y-40,'#ffc1b9',10);floatNum(hero.x,hero.y-75,'-1','#ffb5b5');updateUI();if(hero.hp<=0){hero.hp=6;hero.x=230;hero.y=GROUND;hero.vx=0;hero.vy=0;hero.inv=2;hero.grounded=true;stat.coins=Math.max(0,stat.coins-10);updateUI();toast('返回起點，補滿生命！')}}
 }
 // One broad glowing slash travels forward; each living slime is struck at most once per wave.
 for(let i=waves.length-1;i>=0;i--){
   const w=waves[i];const prev=w.x;w.x+=w.dir*SKILL_SPEED*dt;w.t+=dt;w.life-=dt;
   if(Math.abs(w.x-w.origin)>SKILL_RANGE)w.life=0;
   for(const s of slimes){
     if(!s.alive||w.hits.has(s.id))continue;
     const left=Math.min(prev,w.x)-37,right=Math.max(prev,w.x)+37;
     if(s.x>=left&&s.x<=right&&Math.abs((s.y-21)-w.y)<65){w.hits.add(s.id);damageSlime(s,SKILL_DAMAGE,w.dir,true)}
   }
   if(Math.random()<.56)emit(w.x-w.dir*16,w.y+(Math.random()-.5)*55,'#8ae9ff',2);
   if(w.life<=0)waves.splice(i,1);
 }
 for(let i=particles.length-1;i>=0;i--){const a=particles[i];a.life-=dt;a.x+=a.vx*dt;a.y+=a.vy*dt;a.vy+=260*dt;if(a.life<=0)particles.splice(i,1)}
 for(let i=numbers.length-1;i>=0;i--){const a=numbers[i];a.life-=dt;a.y-=dt*35;if(a.life<=0)numbers.splice(i,1)}
 const targetCam=clamp(hero.x-vw*.38,0,Math.max(0,WORLD-vw));camera+=(targetCam-camera)*Math.min(1,dt*6.5);
}
function R(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h))}
function bgHill(camFactor,y,amp,color,period){ctx.beginPath();ctx.moveTo(0,H);for(let x=-24;x<=vw+30;x+=15){const xx=x+camera*camFactor;ctx.lineTo(x,y+Math.sin(xx/period)*amp+Math.sin(xx/(period*.56))*(amp*.37))}ctx.lineTo(vw,H);ctx.closePath();ctx.fillStyle=color;ctx.fill()}
